# Builds the Bulwark push relay from its upstream source, pinned by commit, with TWO changes.
# patches/0001-harden-for-public-exposure.patch: Web Push endpoints must be on a known push service
# (without it the relay can be made to POST to any https URL), unconfirmed subscriptions capped and
# expired so registrations cannot fill the store, and UnifiedPush off unless opted in.
# patches/0002-dedupe-cluster-pushes.patch: a clustered mail server sends each push from every node,
# so the relay forwards one and drops the identical copies. Everything else is upstream, including its Dockerfile. The
# image is pushed only after an end-to-end check against the built image passes, with the unpatched
# upstream image as the negative control. The release tag is pushed only from main, and only once: a tag that already
# exists is never re-pushed, so changing what is built means bumping VERSION. A dispatch from another branch pushes
# branch-<short sha> instead, and a pull request runs every step but the registry login and the push (MainThrive MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "patches/**", "scripts/**"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream publishes no tags or releases, so the pin is a commit on main: immutable, unlike a branch.
  RELAY_SHA: d4f34c04396c920a1cded5443e7361a4d94d3010
  IMAGE: ghcr.io/bill-scheffer/bulwark-relay-hardened
  VERSION: 0.1.0-d4f34c0-h3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: patch

      - name: Check out the relay at the pinned commit (patched)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: bulwarkmail/relay
          ref: ${{ env.RELAY_SHA }}
          path: relay

      - name: Check out the relay at the pinned commit (upstream, the negative control)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: bulwarkmail/relay
          ref: ${{ env.RELAY_SHA }}
          path: upstream

      # ⛔ A release tag names one image, forever (MAI-1021). A main build that re-pushed it would leave the digest
      # production pins untagged, and an untagged version is the first thing a registry cleanup deletes. So a tag that
      # already exists is never re-pushed, and a change to what goes into the image must bump VERSION; this fails a
      # pull request that makes one without the bump. What goes in: patches/**, any other file of this repo that a step
      # up to the image build names (patch/<path>), the env: values, and every step up to and including the image build.
      # Left out: comments, step names and this step, none of which can change the image.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="${VERSION}"
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git -C patch fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the step that uses docker/build-push-action, minus what cannot change the image.
          inputs_of() {
            git -C patch show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/ }
              /^[[:space:]]*(- )?uses: docker\/build-push-action/ { build = 1 }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/^[[:space:]]*(- )?name:/'
          }
          # This repo's files those steps name: patches/** today. A script added before the build is then covered too.
          refs=$(inputs_of HEAD | { grep -oE '(^|[^[:alnum:]_-])patch/[[:alnum:]_./-]+' || true; } | sed -E 's#^[^p]?patch/##' | sort -u)
          changed=$(git -C patch diff --name-only "$rev" HEAD -- patches $refs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- bump VERSION"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      - name: Apply the patch, and prove it changed exactly its six files
        working-directory: relay
        run: |
          set -eu
          git apply --check ../patch/patches/0001-harden-for-public-exposure.patch
          git apply ../patch/patches/0001-harden-for-public-exposure.patch
          got=$(git status --porcelain | LC_ALL=C sort | tr '\n' '|')
          want=$(printf '%s\n' ' M src/server.ts' ' M src/store.ts' ' M src/types.ts' ' M src/validation.test.ts' ' M src/validation.ts' '?? src/store.test.ts' | LC_ALL=C sort | tr '\n' '|')
          [ "$got" = "$want" ] || { echo "::error::unexpected change set: $got"; exit 1; }

      - name: Apply patch 0002 on top, and prove it changed exactly its four files
        working-directory: relay
        run: |
          set -eu
          git add -A && git -c user.email=ci@example.invalid -c user.name=ci commit -qm "patch 0001"
          git apply --check ../patch/patches/0002-dedupe-cluster-pushes.patch
          git apply ../patch/patches/0002-dedupe-cluster-pushes.patch
          got=$(git status --porcelain | LC_ALL=C sort | tr '\n' '|')
          want=$(printf '%s\n' ' M src/metrics.ts' ' M src/server.ts' '?? src/dedupe.test.ts' '?? src/dedupe.ts' | LC_ALL=C sort | tr '\n' '|')
          [ "$got" = "$want" ] || { echo "::error::unexpected change set: $got"; exit 1; }

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "22"

      - name: Upstream's tests plus the patch's, and the typecheck
        working-directory: relay
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npx tsx --test src/*.test.ts
          npx tsc --noEmit

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with the relay's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=Bulwark push relay @ ${{ env.RELAY_SHA }}, hardened for public exposure, cluster pushes deduplicated
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build upstream unpatched, for the negative control only (never pushed)
        run: docker build -q -t relay-upstream:control upstream

      - name: End-to-end against the built image
        run: bash patch/scripts/e2e.sh "${IMAGE}:${VERSION}" relay-upstream:control

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any other branch
      # pushes the same tested image under branch-<short sha> alone, never the release tag. A pull request never logs
      # in or pushes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, only after the end-to-end check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${VERSION}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${digest}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- relay: \`bulwarkmail/relay\` @ \`${RELAY_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
